name: Build Registro Pillole

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild             -project RegistroPillole.xcodeproj             -scheme RegistroPillole             -sdk iphonesimulator             -configuration Debug             CODE_SIGNING_ALLOWED=NO             build

      - name: Build watchOS simulator app
        run: |
          xcodebuild             -project RegistroPillole.xcodeproj             -target RegistroPilloleWatch             -sdk watchsimulator             -configuration Debug             CODE_SIGNING_ALLOWED=NO             build
