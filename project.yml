name: RegistroPillole

options:
  bundleIdPrefix: it.chri
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  postGenCommand: sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' RegistroPillole.xcodeproj/project.pbxproj

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic

targets:
  RegistroPillole:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Sources/iOS
    dependencies:
      - target: RegistroPilloleWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.chri.registropillole
        INFOPLIST_KEY_CFBundleDisplayName: Registro Pillole
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  RegistroPilloleWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: Shared
      - path: Sources/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.chri.registropillole.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Registro Pillole
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: it.chri.registropillole
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO

schemes:
  RegistroPillole:
    build:
      targets:
        RegistroPillole: all
